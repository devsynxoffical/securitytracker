<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>WorkPulse Workstation</title>
    <!-- FR-SEC-22: no external connect; the renderer reaches the server only through the preload bridge. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply the stored theme before the first paint so the window never flashes the wrong colours.
      try {
        var t = localStorage.getItem('wp.theme');
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg text-ink antialiased font-sans overflow-hidden">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
