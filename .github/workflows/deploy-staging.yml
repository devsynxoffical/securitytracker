# Build and publish images on main, then deploy to staging (02 section 5: deploy to staging on main, manual promotion to production).
# The deploy step is a documented placeholder: it needs the secrets listed below and a reachable staging host.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/companyos-api
  IMAGE_ADMIN: ghcr.io/${{ github.repository_owner }}/companyos-admin

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Image tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_API }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_API }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/admin.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.${{ vars.STAGING_DOMAIN }}/api/v1
          tags: |
            ${{ env.IMAGE_ADMIN }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_ADMIN }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://admin.${{ vars.STAGING_DOMAIN }}
    # Required repository/environment configuration (no values in this file):
    #   vars.STAGING_DOMAIN            e.g. staging.example.com
    #   secrets.STAGING_SSH_HOST       host or IP running docker compose
    #   secrets.STAGING_SSH_USER       deploy user with docker access
    #   secrets.STAGING_SSH_KEY        private key for that user
    # The host holds infra/.env.prod (filled) and a checkout of this repository under /opt/companyos.
    steps:
      - name: Guard - configuration present
        run: |
          if [ -z "${{ secrets.STAGING_SSH_HOST }}" ]; then
            echo "Staging deploy skipped: STAGING_SSH_HOST secret is not configured." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_ENV"
          else
            echo "configured=true" >> "$GITHUB_ENV"
          fi

      - name: Deploy over SSH
        if: env.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -eu
            cd /opt/companyos
            git fetch --quiet origin main && git checkout --quiet origin/main
            sed -i "s#^IMAGE_API=.*#IMAGE_API=${{ env.IMAGE_API }}:${{ needs.images.outputs.tag }}#" infra/.env.prod
            sed -i "s#^IMAGE_ADMIN=.*#IMAGE_ADMIN=${{ env.IMAGE_ADMIN }}:${{ needs.images.outputs.tag }}#" infra/.env.prod
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml pull api worker admin
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d api
            docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d worker admin proxy
            curl -fsS "https://api.$(grep ^DOMAIN= infra/.env.prod | cut -d= -f2)/api/v1/health/ready"

  # Production promotion is manual: re-run this workflow with workflow_dispatch against a `production`
  # environment that requires reviewers, pointing at PRODUCTION_* secrets. Pilot channel updates precede
  # stable by at least 3 days (11 section 5).
