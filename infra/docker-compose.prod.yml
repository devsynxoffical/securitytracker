# Production stack (02-architecture.md section 5): proxy, api, worker, postgres, redis, optional MinIO.
# Usage:
#   cp infra/.env.prod.example infra/.env.prod   # fill secrets, never commit
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml up -d
#   docker compose --env-file infra/.env.prod -f infra/docker-compose.prod.yml --profile storage up -d   # with MinIO

name: companyos

x-api-env: &api-env
  NODE_ENV: production
  PORT: '4000'
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET}
  ENCRYPTION_SECRET: ${ENCRYPTION_SECRET}
  ADMIN_ORIGIN: ${ADMIN_ORIGIN:-https://admin.${DOMAIN}} # where people open the admin panel; password reset links point here
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: https://api.${DOMAIN}/api/v1/mail/oauth/callback
  GOOGLE_PUBSUB_TOPIC: ${GOOGLE_PUBSUB_TOPIC:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-WorkPulse <no-reply@${DOMAIN}>}

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      UPDATES_CORS_ORIGIN: ${UPDATES_CORS_ORIGIN:-https://admin.${DOMAIN}} # the site that reads latest.json (set to your web host when the admin lives elsewhere)
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./updates:/srv/updates:ro # desktop installers + latest.json, written by release-desktop.yml over SSH
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_started

  api:
    image: ${IMAGE_API:-ghcr.io/devsynxoffical/companyos-api:latest}
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
      RUN_MIGRATIONS: 'true' # forward-only, runs before the API accepts traffic (02 section 5)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:4000/api/v1/health/ready']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    image: ${IMAGE_API:-ghcr.io/devsynxoffical/companyos-api:latest}
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      <<: *api-env
      WORKER_ENABLED: 'true'
      PORT: '4001'
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  admin:
    image: ${IMAGE_ADMIN:-ghcr.io/devsynxoffical/companyos-admin:latest}
    build:
      context: ..
      dockerfile: infra/docker/admin.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}/api/v1
    restart: unless-stopped
    expose:
      - '8080'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres -c shared_buffers=512MB -c max_connections=200 -c wal_level=replica
               -c archive_mode=on -c archive_command='test ! -f /backups/wal/%f && cp %p /backups/wal/%f'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: '30'
    volumes:
      - backups:/backups
      - ./backup/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
    entrypoint: ['/bin/sh', '-c', 'while true; do /usr/local/bin/pg-backup.sh; sleep 86400; done']
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ['storage']
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  backups:
